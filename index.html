<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第五人格｜限定福利中心</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  body {
    font-family:
      "Noto Sans TC",
      "Microsoft JhengHei",
      sans-serif;
  }

  .bg-pattern {
    background:
      radial-gradient(circle at 15% 15%, rgba(236,145,184,.18) 0 8px, transparent 9px),
      radial-gradient(circle at 85% 28%, rgba(236,145,184,.14) 0 10px, transparent 11px),
      radial-gradient(circle at 20% 80%, rgba(236,145,184,.15) 0 7px, transparent 8px),
      linear-gradient(145deg, #fff8fb, #f7edf3 55%, #fff8fb);
  }

  .petal {
    position: absolute;
    width: 18px;
    height: 10px;
    border-radius: 100% 0 100% 0;
    background: rgba(232, 133, 176, .35);
    transform: rotate(25deg);
  }

  .glass-card {
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow:
      0 20px 50px rgba(110,75,90,.12),
      inset 0 0 0 1px rgba(238,181,205,.35);
  }

  .reward-card {
    background: linear-gradient(
      135deg,
      rgba(255,255,255,.98),
      rgba(255,249,252,.95)
    );
    border: 1px solid #f0d9e3;
    box-shadow: 0 8px 22px rgba(100,70,85,.08);
  }

  .claim-btn {
    background: linear-gradient(135deg, #171719, #303033);
    box-shadow: 0 8px 18px rgba(0,0,0,.16);
    transition: all .2s ease;
  }

  .claim-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(0,0,0,.22);
  }

  .claim-btn:active {
    transform: scale(.97);
  }

  .pink-text {
    color: #d65391;
  }

  .gold-box {
    background: #fff9dd;
    border: 1px dashed #dfbd45;
  }

  .modal-bg {
    backdrop-filter: blur(5px);
  }
</style>
</head>

<body class="bg-pattern min-h-screen">

<!-- 背景裝飾 -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">

  <div class="petal" style="top:10%;left:8%;"></div>
  <div class="petal" style="top:23%;right:13%;transform:rotate(130deg);"></div>
  <div class="petal" style="top:42%;left:5%;transform:rotate(70deg);"></div>
  <div class="petal" style="top:65%;right:8%;transform:rotate(160deg);"></div>
  <div class="petal" style="bottom:12%;left:14%;transform:rotate(40deg);"></div>

</div>


<div class="relative w-full max-w-[430px] mx-auto px-5 py-8">

  <!-- 標題 -->
  <div class="text-center">

    <div class="inline-flex items-center px-5 py-2 rounded-full
                bg-white border border-pink-200
                shadow-[0_6px_20px_rgba(210,100,150,.12)]">

      <span class="text-[12px] tracking-[3px] pink-text font-medium">
        LIMITED GIFT
      </span>

      <span class="mx-2 text-pink-300">•</span>

      <span class="text-[12px] tracking-[2px] text-gray-500">
        限定福利開啟
      </span>

    </div>


    <h1 class="mt-7 text-[39px] leading-tight font-black tracking-tight text-[#171719]">

      限定福利
      <span class="pink-text">領取</span>

    </h1>


    <p class="mt-3 text-[14px] text-gray-500 tracking-[1px]">
      第五人格限定活動・點擊下方一鍵領取
    </p>

  </div>


  <!-- 福利主卡片 -->
  <div class="glass-card rounded-[30px] mt-9 p-7">

    <!-- 福利 1 -->
    <div class="reward-card rounded-[20px] p-4 flex items-center">

      <div class="w-[58px] h-[58px] rounded-[17px]
                  bg-pink-50 border border-pink-100
                  flex items-center justify-center text-[29px]">
        💎
      </div>

      <div class="ml-4 flex-1">

        <p class="font-black text-[17px] text-[#222]">
          靈感 × 2300
        </p>

        <p class="pink-text text-[13px] mt-1">
          限定福利
        </p>

      </div>

      <button
        class="claim-btn claim-button text-white
               px-5 py-3 rounded-full
               text-[13px] font-bold"
        data-name="靈感 × 2300">
        一鍵領取
      </button>

    </div>


    <!-- 福利 2 -->
    <div class="reward-card rounded-[20px] p-4 flex items-center mt-4">

      <div class="w-[58px] h-[58px] rounded-[17px]
                  bg-pink-50 border border-pink-100
                  flex items-center justify-center text-[29px]">
        💡
      </div>

      <div class="ml-4 flex-1">

        <p class="font-black text-[17px] text-[#222]">
          線索 × 3200
        </p>

        <p class="pink-text text-[13px] mt-1">
          限定福利
        </p>

      </div>

      <button
        class="claim-btn claim-button text-white
               px-5 py-3 rounded-full
               text-[13px] font-bold"
        data-name="線索 × 3200">
        一鍵領取
      </button>

    </div>


    <!-- 福利 3 -->
    <div class="reward-card rounded-[20px] p-4 flex items-center mt-4">

      <div class="w-[58px] h-[58px] rounded-[17px]
                  bg-pink-50 border border-pink-100
                  flex items-center justify-center text-[29px]">
        🔮
      </div>

      <div class="ml-4 flex-1">

        <p class="font-black text-[17px] text-[#222]">
          碎片 × 3200
        </p>

        <p class="pink-text text-[13px] mt-1">
          限定福利
        </p>

      </div>

      <button
        class="claim-btn claim-button text-white
               px-5 py-3 rounded-full
               text-[13px] font-bold"
        data-name="碎片 × 3200">
        一鍵領取
      </button>

    </div>


    <!-- 提示區 -->
    <div class="gold-box rounded-[18px] mt-6 p-5">

      <p class="font-bold text-[14px] text-[#805b25] leading-7">
        🎁 限定福利開啟：
        <span class="font-normal">
          點擊領取後進入福利頁面
        </span>
      </p>

      <p class="font-bold text-[14px] text-[#805b25] leading-7">
        ⏰ 活動期間：
        <span class="font-normal">
          限時開放，數量有限
        </span>
      </p>

    </div>

  </div>


  <!-- 頁尾 -->
  <div class="text-center mt-7 mb-8">

    <p class="text-[12px] text-gray-400 tracking-[1px]">
      第五人格限定福利中心
    </p>

    <p class="text-[10px] text-gray-300 mt-2">
      本頁為活動資訊展示頁，非第五人格官方網站
    </p>

  </div>

</div>


<!-- ==================== 彈窗 ==================== -->

<div
  id="modal"
  class="hidden fixed inset-0 z-50
         bg-black/45 modal-bg
         flex items-center justify-center px-5"
>

  <div
    class="bg-white rounded-[24px]
           w-full max-w-[350px]
           p-6 shadow-2xl
           text-center"
  >

    <div class="w-[62px] h-[62px]
                mx-auto rounded-full
                bg-pink-50
                flex items-center justify-center
                text-[30px]">
      🎁
    </div>


    <h2 class="mt-4 text-[20px] font-black text-[#222]">
      限定福利領取
    </h2>


    <div class="mt-4 rounded-[14px]
                bg-pink-50
                border border-pink-100
                py-4">

      <p
        id="modalReward"
        class="pink-text font-black text-[16px]"
      >
        靈感 × 2300
      </p>

    </div>


    <p class="text-[13px] text-gray-500 leading-6 mt-5">
      點擊下方按鈕前往福利頁面，
      完成後續領取流程。
    </p>


    <!-- LINE -->
    <button
      id="goClaim"
      class="mt-5 w-full
             bg-[#06C755]
             text-white
             font-bold
             py-3.5
             rounded-[13px]
             shadow-lg"
    >
      前往領取
    </button>


    <button
      id="closeModal"
      class="mt-3 w-full
             bg-gray-100
             text-gray-500
             font-bold
             py-3.5
             rounded-[13px]"
    >
      返回
    </button>

  </div>

</div>


<script>

  const modal = document.getElementById("modal");
  const modalReward = document.getElementById("modalReward");
  const closeModal = document.getElementById("closeModal");

  const claimButtons =
    document.querySelectorAll(".claim-button");


  // 點擊福利
  claimButtons.forEach(button => {

    button.addEventListener("click", () => {

      const reward =
        button.getAttribute("data-name");

      modalReward.textContent = reward;

      modal.classList.remove("hidden");

    });

  });


  // 關閉彈窗
  closeModal.addEventListener("click", () => {

    modal.classList.add("hidden");

  });


  // 點擊背景關閉
  modal.addEventListener("click", (event) => {

    if (event.target === modal) {
      modal.classList.add("hidden");
    }

  });


  // LINE 領取連結
  document.getElementById("goClaim").addEventListener("click", () => {

    window.location.href =
      "https://lin.ee/9PdATDM";

  });

</script>

</body>
</html>
