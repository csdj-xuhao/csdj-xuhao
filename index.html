<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>必勝客 40 週年慶｜活動資訊</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family:
      "Noto Sans TC",
      "Microsoft JhengHei",
      sans-serif;
    background:
      radial-gradient(circle at 50% 10%, #e9281c 0%, #b40000 38%, #720000 100%);
    color: #fff;
  }

  .page {
    width: 100%;
    max-width: 430px;
    margin: auto;
    min-height: 100vh;
    padding: 18px 14px 50px;
  }

  .hero {
    width: 100%;
    overflow: hidden;
    border-radius: 22px;
    border: 1px solid rgba(255,215,80,.7);
    box-shadow:
      0 12px 35px rgba(0,0,0,.35),
      0 0 30px rgba(255,190,0,.12);
    background: #a90000;
  }

  .hero img {
    width: 100%;
    display: block;
    object-fit: cover;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid #f4c52b;
    background: rgba(125,0,0,.65);
    color: #ffd52e;
    font-size: 12px;
    letter-spacing: 2px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
  }

  .badge-dot {
    width: 7px;
    height: 7px;
    background: #ffd52e;
    border-radius: 50%;
  }

  .info-card {
    margin-top: 26px;
    padding: 14px;
    border-radius: 25px;
    background: rgba(90,0,0,.52);
    border: 1px solid rgba(255,210,90,.18);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,.025),
      0 12px 30px rgba(0,0,0,.18);
  }

  .info-row {
    display: flex;
    align-items: center;
    min-height: 65px;
    padding: 15px 17px;
    border-radius: 17px;
    background: rgba(116,0,0,.7);
    border: 1px solid rgba(255,255,255,.035);
  }

  .info-row + .info-row {
    margin-top: 10px;
  }

  .info-title {
    width: 92px;
    flex-shrink: 0;
    color: #ffd529;
    font-size: 14px;
    font-weight: 800;
  }

  .info-value {
    color: #fff;
    font-size: 14px;
    line-height: 1.5;
  }

  .offer-card {
    margin-top: 28px;
    padding: 24px 20px;
    border-radius: 24px;
    background:
      linear-gradient(145deg, #d51a10, #a70000);
    border: 1px solid rgba(255,210,70,.35);
    box-shadow:
      0 15px 35px rgba(0,0,0,.28),
      inset 0 1px rgba(255,255,255,.08);
  }

  .offer-small {
    color: #ffd52e;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .offer-price {
    margin-top: 8px;
    font-size: 38px;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -1px;
  }

  .offer-sub {
    margin-top: 8px;
    color: #ffe8e8;
    font-size: 13px;
  }

  .code-box {
    margin-top: 18px;
    padding: 17px;
    border-radius: 17px;
    background: rgba(255,255,255,.09);
    border: 1px dashed rgba(255,220,90,.65);
    text-align: center;
  }

  .code-label {
    color: #ffd52e;
    font-size: 12px;
    font-weight: 700;
  }

  .code {
    margin-top: 5px;
    color: #fff;
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
  }

  .notice {
    margin-top: 20px;
    padding: 15px 17px;
    border-radius: 17px;
    background: rgba(70,0,0,.42);
    color: #ffdcdc;
    font-size: 12px;
    line-height: 1.8;
  }

  .action-btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg, #ffd92f, #ffb900);
    color: #7c0000;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.22);
    transition: .2s ease;
  }

  .action-btn:active {
    transform: scale(.97);
  }

  .footer {
    margin-top: 30px;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 11px;
    line-height: 1.8;
  }

  .divider {
    width: 60px;
    height: 2px;
    margin: 18px auto;
    background: #ffd329;
    opacity: .8;
  }
</style>
</head>

<body>

<div class="page">

  <!-- 活動主圖 -->
  <div class="hero">
    <img src="hero.png" alt="必勝客 40 週年慶活動圖片">
  </div>


  <!-- 標題 -->
  <div class="text-center mt-8">

    <div class="badge">
      <span class="badge-dot"></span>
      PIZZA HUT 40週年慶
    </div>

    <h1 class="mt-5 text-[34px] font-black tracking-tight">
      必勝客40週年慶
    </h1>

    <p class="mt-3 text-[14px] text-red-100">
      10/5～10/8 限時4天｜門購代碼 93066
    </p>

  </div>


  <!-- 活動資訊 -->
  <div class="info-card">

    <div class="info-row">
      <div class="info-title">
        活動優惠
      </div>

      <div class="info-value">
        指定組合 $89 起｜最低29折
      </div>
    </div>


    <div class="info-row">
      <div class="info-title">
        活動日期
      </div>

      <div class="info-value">
        10/5 ～ 10/8
      </div>
    </div>


    <div class="info-row">
      <div class="info-title">
        活動方式
      </div>

      <div class="info-value">
        依活動頁面所示方式參與
      </div>
    </div>

  </div>


  <!-- 優惠區 -->
  <div class="offer-card">

    <div class="offer-small">
      限時4天・週年優惠
    </div>

    <div class="offer-price">
      $89 限時優惠
    </div>

    <div class="offer-sub">
      指定組合限時優惠，活動期間數量與適用條件依活動規則為準。
    </div>


    <div class="code-box">

      <div class="code-label">
        活動代碼
      </div>

      <div class="code">
        93066
      </div>

    </div>


    <button
      class="action-btn"
      onclick="showNotice()">
      查看活動資訊
    </button>

  </div>


  <!-- 注意事項 -->
  <div class="notice">

    <strong>活動提醒</strong><br>

    本頁為活動資訊展示頁，
    實際優惠、適用門市、使用方式及活動期限，
    請以必勝客官方公告與實際活動規則為準。

  </div>


  <!-- Footer -->
  <div class="footer">

    <div class="divider"></div>

    <div>
      PIZZA HUT 40週年慶
    </div>

    <div>
      本頁非必勝客官方網站
    </div>

  </div>

</div>


<script>

function showNotice() {

  alert(
    "活動資訊\\n\\n" +
    "必勝客40週年慶\\n" +
    "活動期間：10/5～10/8\\n" +
    "活動代碼：93066\\n\\n" +
    "實際活動內容請以必勝客官方公告為準。"
  );

}

</script>

</body>
</html>
